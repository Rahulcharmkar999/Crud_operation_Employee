<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #0f2a2e;
            --teal: #0f766e;
            --paper: #f2f5f4;
            --card: #ffffff;
            --text: #14262a;
            --muted: #5f7377;
            --line: #dde5e4;
            --red: #b42318;
            --red-dark: #912018;
            --red-soft: #fde8e6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--paper);
            color: var(--text);
            font-family: "Manrope", "Segoe UI", system-ui, Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
        }

        a { text-decoration: none; }
        :focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }

        /* ---------- Top bar + header band ---------- */
        .topbar { background: var(--ink); color: #fff; }

        .topbar-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 64px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 800;
            font-size: 18px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: var(--teal);
        }

        .brand-mark svg { width: 20px; height: 20px; }

        .header-band {
            background: var(--ink);
            color: #fff;
            padding: 20px 24px 92px;
        }

        .header-inner { max-width: 1180px; margin: 0 auto; }

        .header-band h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .header-band p { color: #a9c3c6; margin-top: 6px; }

        /* ---------- Confirmation card ---------- */
        main {
            max-width: 520px;
            margin: -64px auto 0;
            padding: 0 20px 56px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 4px solid var(--red);
            border-radius: 14px;
            padding: 32px;
        }

        .warn-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            margin-bottom: 16px;
            border-radius: 14px;
            background: var(--red-soft);
            color: var(--red);
        }

        .warn-icon svg { width: 26px; height: 26px; }

        .card h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .card > p { color: var(--muted); font-size: 14px; }

        .employee {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0 0;
            padding: 14px 16px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #d5eeea;
            color: #0b5e57;
            font-size: 17px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .emp-name { font-weight: 700; }
        .emp-email { color: var(--muted); font-size: 14px; word-break: break-all; }

        /* ---------- Buttons ---------- */
        .actions { display: flex; gap: 12px; margin-top: 28px; }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: var(--red-dark); }

        .btn-ghost { background: #fff; color: var(--text); border-color: var(--line); }
        .btn-ghost:hover { background: var(--paper); }

        @media (max-width: 520px) {
            .card { padding: 24px 20px; }
            .header-band h1 { font-size: 26px; }
            .actions { flex-direction: column-reverse; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('display_employee_data') }}">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                Employee Manager
            </a>
        </div>
    </header>

    <section class="header-band">
        <div class="header-inner">
            <h1>Delete employee</h1>
            <p>Please confirm before removing this record.</p>
        </div>
    </section>

    <main>
        <div class="card">

            <div class="warn-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
                    <path d="M12 9v4M12 17h.01" />
                </svg>
            </div>

            <h2>Delete this employee?</h2>
            <p>This action cannot be undone. The record will be removed permanently.</p>

            <div class="employee">
                <div class="avatar">{{ (employee.name or '?')[0]|upper }}</div>
                <div>
                    <div class="emp-name">{{ employee.name }}</div>
                    <div class="emp-email">{{ employee.email }}</div>
                </div>
            </div>

            <!-- Deletion happens only on POST -->
            <form method="POST">
                <div class="actions">
                    <a class="btn btn-ghost" href="{{ url_for('display_employee_data') }}">Cancel</a>
                    <button class="btn btn-danger" type="submit">Yes, delete</button>
                </div>
            </form>

        </div>
    </main>

</body>
</html>
